# PostgreSQL 은 Docker Compose 로 띄운다고 가정 (저장소 루트: docker compose up -d).
# 기본 URL/계정은 compose 의 marketengine DB 와 동일. 덮어쓰려면 SPRING_DATASOURCE_* 환경 변수 사용.
spring:
  application:
    name: backend

  flyway:
    placeholders:
      catalogProductCount: ${CATALOG_PRODUCT_COUNT:1000}
      catalogAsOf: ${CATALOG_AS_OF:2026-11-01T00:00:00Z}
      catalogSeed: ${CATALOG_SEED:42}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/marketengine}
    username: ${SPRING_DATASOURCE_USERNAME:marketengine}
    password: ${SPRING_DATASOURCE_PASSWORD:marketengine}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:100}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false

  mvc:
    throw-exception-if-no-handler-found: true

  elasticsearch:
    uris: ${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:16379}
      connect-timeout: ${SPRING_DATA_REDIS_CONNECT_TIMEOUT:1s}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:1s}

  cache:
    type: redis

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:--}]"

server:
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:400}
      min-spare: ${SERVER_TOMCAT_THREADS_MIN_SPARE:50}
    # Tomcat thread metrics (tomcat.threads.*) for Prometheus / Grafana Utilisation panel
    mbeanregistry:
      enabled: true

marketengine:
  logging:
    slow-request-threshold: 200ms
  cache:
    redis:
      enabled: true
      # Maximum lifetime; each feed cache write receives a TTL between 50% and 100% of this value.
      product-list-feed-ttl: 60s
  search:
    # Step 5: product list API — elasticsearch (default) or postgres (QueryDSL fallback).
    backend: elasticsearch
  elasticsearch:
    # Step 1: log cluster info at startup.
    verify-on-startup: true
    index:
      # Step 2: create products index + mapping if missing (tests disable this).
      ensure-on-startup: true
    reindex:
      # 0 runs inline; 1..8 allow the reader to overlap Elasticsearch bulk writes.
      workers: 1
      batch-size: 5000
      log-every-batches: 20

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    elasticsearch:
      # Step 1: ES is not required for API yet; avoid marking the app unhealthy when ES is down.
      enabled: false
