services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: marketengine
      POSTGRES_USER: marketengine
      POSTGRES_PASSWORD: marketengine
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketengine -d marketengine"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - marketengine-pgdata:/var/lib/postgresql/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - marketengine-esdata:/usr/share/elasticsearch/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/marketengine
      SPRING_DATASOURCE_USERNAME: marketengine
      SPRING_DATASOURCE_PASSWORD: marketengine
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      SPRING_DATA_REDIS_HOST: redis
      MARKETENGINE_CACHE_REDIS_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_ORIGIN: http://backend:8080
    environment:
      BACKEND_ORIGIN: http://backend:8080
    depends_on:
      - backend
    ports:
      - "5173:5173"

  prometheus:
    image: prom/prometheus:v3.6.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      # k6 등에서 remote write로 시계열을 받을 때 필요 (기본값 false)
      - "--web.enable-remote-write-receiver"
      # k6 K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM=true 일 때 Trend → native histogram 수신
      - "--enable-feature=native-histograms"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    ports:
      - "5305:3000"

volumes:
  marketengine-pgdata:
  marketengine-esdata:
  grafana-data:
