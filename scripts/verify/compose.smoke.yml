# Overlay for the disposable verification project created by run-commerce-smoke.ps1.
services:
  postgres:
    ports: !reset []
  redis:
    ports: !reset []
  elasticsearch:
    ports: !override ["127.0.0.1::9200"]
  backend:
    ports: !override ["127.0.0.1::8080"]
    environment:
      CATALOG_PRODUCT_COUNT: "1000"
      SPRING_PROFILES_ACTIVE: default
